name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/**"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time against the dev state; never cancel a run mid-apply.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  WORKDIR: environments/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # azurerm provider + backend: OIDC, no secrets.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_pipeline_principal_object_id: ${{ vars.AZURE_APPLY_OBJECT_ID }}
  TF_VAR_repository: ${{ github.repository }}

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate root modules
        run: |
          for dir in environments/dev bootstrap; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0

      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,github_actions
          quiet: true
          soft_fail: false

  plan:
    name: Plan (dev)
    needs: static
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt

      - name: Job summary
        working-directory: ${{ env.WORKDIR }}
        run: |
          {
            echo "## Terraform plan: dev"
            echo '```'
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo '```'
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_PATH: ${{ env.WORKDIR }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.PLAN_PATH, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(see run)'])[0];
            const marker = '<!-- terraform-plan-dev -->';
            const max = 60000;
            const body = [
              marker,
              `### Terraform plan: \`dev\``,
              `**${summary}**`,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan.length > max ? plan.slice(0, max) + '\n... truncated, see the run summary' : plan,
              '```',
              '</details>',
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # The reviewed plan is the one applied: ship the binary plan and the
      # provider lock file to the apply job.
      - name: Upload plan
        if: github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: |
            ${{ env.WORKDIR }}/tfplan
            ${{ env.WORKDIR }}/.terraform.lock.hcl
          retention-days: 5
          include-hidden-files: true

  apply:
    name: Apply (dev)
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the human approval gate.
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.WORKDIR }}

      - uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Terraform apply (saved plan)
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -lock-timeout=5m -input=false tfplan

      - name: Read outputs
        id: tf
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "aks_name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"
          echo "aks_rg=$(terraform output -raw aks_resource_group)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The API server is private, so a hosted runner cannot reach it directly.
      # `command invoke` runs kubectl inside the cluster via the ARM API.
      - name: Smoke test private cluster
        run: |
          az aks command invoke \
            --resource-group "${{ steps.tf.outputs.aks_rg }}" \
            --name "${{ steps.tf.outputs.aks_name }}" \
            --command "kubectl get nodes -o wide && kubectl get pods -n kube-system"
