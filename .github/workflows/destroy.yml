name: destroy

# Manual teardown to stop the meter on the dev environment. The `dev`
# environment's required-reviewer gate is the confirmation step, and the job
# only runs from main so a branch cannot alter what gets destroyed.
#
# Around the destroy, scripts/teardown-audit.sh inventories the environment:
#   before : every resource, sorted into Terraform-managed, AKS-managed and
#            UNMANAGED (created outside Terraform). Unmanaged resources stop the
#            run before anything is deleted: delete or import them, or remove
#            them deliberately with `make destroy ALLOW_UNMANAGED=true`.
#   after  : fails the run if any resource group or tagged resource survived.
# Both reports land in the run summary.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  WORKDIR: environments/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_pipeline_principal_object_id: ${{ vars.AZURE_APPLY_OBJECT_ID }}
  TF_VAR_repository: ${{ github.repository }}

jobs:
  destroy:
    name: Destroy (dev)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.WORKDIR }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Audit before destroy
        env:
          TF_DIR: ${{ env.WORKDIR }}
        run: scripts/teardown-audit.sh pre

      - name: Plan destroy
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -destroy -lock-timeout=5m -out=destroy.tfplan

      - name: Destroy
        id: destroy
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -lock-timeout=5m -input=false destroy.tfplan

      # Runs even if the destroy failed partway, so the summary shows what is left.
      - name: Verify nothing is left
        if: always() && steps.destroy.outcome != 'skipped'
        env:
          TF_DIR: ${{ env.WORKDIR }}
        run: scripts/teardown-audit.sh post
